<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta Recomendada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white py-3 text-center d-flex flex-column flex-md-row align-itms-md-start justify-content-between mb-3">
                        <h2 class="mb-0 text-white" th:text="${area.nombre}">Nombre del Área</h2>
                        <a th:href="@{/}" class="btn btn-primary btn-md px-5"><i class="bi bi-search pe-2"></i> Nueva consulta</a>
                    </div>
                    <div class="card-body p-4 pt-0">
                        
                        <div class="mb-4">
                            <h3>💻 Lenguajes Recomendados:</h3>
                            <p class="fs-5" th:text="${area.lenguajesRecomendados}"></p>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex flex-column flex-md-row align-itms-md-start justify-content-between mb-3 pt-4">
                                <h3>🗺️ Ruta de Aprendizaje Sugerida:</h3>
                                <a th:href="@{'/pdf/' + ${nombrePdf} + '.pdf'}" target="_blank" class="btn btn-outline-danger">
                                    <i class="bi bi-arrow-up-right-square-fill"></i> Abrir PDF en pestaña completa
                                </a>
                            </div>
                            <div th:with="nombrePdf=${#strings.replace(area.nombre, ' ', '')}">     
                                <div class="ratio ratio-4x3 mb-2" style="height: 600px;">
                                    <embed th:src="@{'/pdf/' + ${nombrePdf} + '.pdf'}" 
                                        type="application/pdf" 
                                        width="100%" 
                                        height="100%" />
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 pt-4">
                            <h3>🛠️ Herramientas de la Industria:</h3>
                            <p class="fs-5" th:text="${area.herramientas}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
